name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios-pwa:
    name: 📱 iOS PWA Build
    runs-on: macos-latest
    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v3

      - name: 🛠 Install Dependencies
        run: |
          brew install cocoapods
          pod setup

      - name: 📦 Install CocoaPods
        run: pod install
        working-directory: ios

      - name: 🚀 Build PWA iOS App
        run: xcodebuild -workspace ios/App.xcworkspace -scheme App -configuration Release -sdk iphoneos

      - name: 📂 Create Payload Directory
        run: mkdir -p Payload
        working-directory: ios/build/Release-iphoneos

      - name: 📁 Move App to Payload
        run: mv App.app Payload
        working-directory: ios/build/Release-iphoneos

      - name: 📦 Package IPA File
        run: zip -r -9 PWA_Export.ipa Payload
        working-directory: ios/build/Release-iphoneos

      - name: 🚀 Upload IPA to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ios/build/Release-iphoneos/PWA_Export.ipa
          tag: v1.0
          overwrite: true
          body: "First PWA iOS Release"
